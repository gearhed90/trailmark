<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><title>Trailmark</title>
<style>
:root{--bg:#0b0d12;--line:#2a3140;--text:#f4efe6;--muted:#9aa3b2;--accent:#e8a15a;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:calc(14px + var(--safe-t)) 18px 8px;display:flex;justify-content:space-between;align-items:baseline}h1{margin:0;font-size:22px;letter-spacing:.08em}h1 span{color:var(--accent)}header p{margin:0;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
main{padding:8px 16px calc(28px + var(--safe-b));max-width:520px;margin:0 auto}
.stage{background:#10141c;border:1px solid var(--line);border-radius:28px;padding:16px;display:flex;flex-direction:column;align-items:center}
.phone{width:min(250px,68vw);aspect-ratio:1179/2556;border-radius:28px;overflow:hidden;position:relative;background:#000}
.phone canvas{width:100%;height:100%;display:block}
.clock{position:absolute;left:0;right:0;top:16%;text-align:center;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.55);pointer-events:none}
.clock .time{font-size:54px;font-weight:560;letter-spacing:-1px;line-height:1}.clock .date{font-size:13px}
.hint,.by,.fine{color:var(--muted);font-size:12px}.hint{margin:10px 0 0;text-align:center}.fine{line-height:1.45;margin-top:14px}
.row{display:flex;gap:8px;margin-top:14px}.row button{flex:1}
button,select,input{font:inherit;color:var(--text);background:#141820;border:1px solid var(--line);border-radius:14px;padding:12px 14px}button.primary{background:linear-gradient(180deg,#f0b56e,#d4893d);color:#1a1208;border:0;font-weight:700}button.ghost{background:transparent}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}select,input[type=text]{width:100%}
.quote-box{margin-top:14px;background:#141820;border:1px solid var(--line);border-radius:16px;padding:14px}q{font-size:16px;line-height:1.35}
</style></head><body>
<header><h1>Trail<span>mark</span></h1><p>Lock screen</p></header>
<main>
<div class="stage"><div class="phone"><canvas id="preview" width="1179" height="2556"></canvas><div class="clock"><div class="date" id="dateLabel"></div><div class="time" id="timeLabel">9:41</div></div></div><p class="hint" id="sceneHint">Pulling this week's renders…</p></div>
<div class="quote-box"><q id="quoteText"></q><div class="by" id="quoteBy"></div></div>
<div class="row"><button id="shuffle">New pair</button><button id="daily">Today</button><button id="save" class="primary">Save wallpaper</button></div>
<label>Scene set</label><div class="grid"><select id="theme"></select><select id="category"></select></div>
<label>Your line</label><input id="custom" type="text" maxlength="140" placeholder="Type your own, then Apply"/><div class="row"><button id="applyCustom">Apply</button><button id="refresh" class="ghost">Refresh week</button></div>
<p class="fine">Renders and CGI only. About 20 kept on this phone until next Sunday. If a result looks like a scan, hit Refresh week. Save wallpaper, then Photos, Share, Use as Wallpaper, Lock Screen.</p>
</main>
<script>
const QUERIES=[
["military","\"3D render\" soldier armor"],["military","blender render armor soldier"],["military","\"digital art\" soldier"],
["crusader","\"3D render\" knight"],["crusader","blender render medieval knight"],["crusader","\"digital art\" crusader knight"],
["marble","\"3D render\" greek statue"],["marble","blender render classical statue"],["marble","\"digital art\" greek sculpture"]
];
const QUOTES=[["military","Hold the ridge. The valley can wait."],["military","Quiet hands. Clear orders. Move."],["military","The watch is the work."],["military","Stand where you were put until you are relieved."],["crusader","Keep the vow when the road gets long."],["crusader","Stone outlasts the weather. So can you."],["crusader","A door is only a door if you walk through it."],["marble","The crack is still standing. So are you."],["marble","Leave something that outlasts the week."],["grit","Start before you feel ready."],["grit","The hard part is the part. Do that."],["grit","One clean hour beats a day of almost."],["build","Make the ugly version. It teaches faster."],["focus","Name the next step. Only the next step."],["classic","What stands in the way becomes the way."]];
const BAD=/cyclopaedia|encyclopedia|scan|diagram|map\b|book\b|plate\b|engraving|photograph|photo\b|portrait of/i;
const GOOD=/render|blender|cgi|3d|digital|concept|unreal|octane|cinema/i;
const $=id=>document.getElementById(id);const canvas=$("preview"),ctx=canvas.getContext("2d");const loaded={};
const state={theme:"all",category:"all",qi:0,si:0,custom:"",pool:[]};
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function weekKey(){const d=new Date();const sun=new Date(d);sun.setDate(d.getDate()-d.getDay());return sun.getFullYear()+"-"+(sun.getMonth()+1)+"-"+sun.getDate();}
function dayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function scenes(){return state.theme==="all"?state.pool:state.pool.filter(s=>s.theme===state.theme);}
function quotes(){return state.category==="all"?QUOTES:QUOTES.filter(q=>q[0]===state.category);}
function paintFallback(){const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,"#1b2744");g.addColorStop(.5,"#8a5a3a");g.addColorStop(1,"#120d0c");ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);}
function wrap(text){ctx.font="560 64px Georgia, serif";const words=text.split(" "),lines=[],max=canvas.width-220;let line="";for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>max&&line){lines.push(line);line=w;}else line=t;}if(line)lines.push(line);return lines;}
function draw(){
  const listS=scenes().length?scenes():[{name:"This week",src:""}];
  const scene=listS[state.si%listS.length];
  const q=state.custom?["you",state.custom]:quotes()[state.qi%quotes().length];
  const img=loaded[scene.src];
  if(img&&img.complete&&img.naturalWidth){const scale=Math.max(canvas.width/img.width,canvas.height/img.height);ctx.drawImage(img,(canvas.width-img.width*scale)/2,(canvas.height-img.height*scale)/2,img.width*scale,img.height*scale);}else paintFallback();
  const scrim=ctx.createLinearGradient(0,canvas.height*.55,0,canvas.height);scrim.addColorStop(0,"rgba(0,0,0,0)");scrim.addColorStop(1,"rgba(0,0,0,.72)");ctx.fillStyle=scrim;ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#f7f1e6";ctx.textAlign="center";ctx.textBaseline="top";ctx.font="560 64px Georgia, serif";ctx.shadowColor="rgba(0,0,0,.7)";ctx.shadowBlur=16;
  wrap(q[1]).forEach((line,i)=>ctx.fillText(line,canvas.width/2,1860+i*82));ctx.shadowBlur=0;
  $("quoteText").textContent=q[1];$("quoteBy").textContent=q[0];
  $("sceneHint").textContent=(scene.name||"Render")+" \u00b7 "+state.pool.length+" renders this week";
}
function load(scene){if(!scene||!scene.src||loaded[scene.src])return;const img=new Image();img.crossOrigin="anonymous";img.onload=()=>{loaded[scene.src]=img;draw();};img.src=scene.src;}
async function search(theme,query){
  const url="https://commons.wikimedia.org/w/api.php?origin=*&action=query&format=json&generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch="+encodeURIComponent(query)+"&prop=imageinfo&iiprop=url|mime&iiurlwidth=900";
  const data=await fetch(url).then(r=>r.json());
  const pages=data.query&&data.query.pages?Object.values(data.query.pages):[];
  return pages.map(p=>{const info=p.imageinfo&&p.imageinfo[0];const title=(p.title||"").replace(/^File:/,"");if(!info||!info.thumburl||/\.svg$/i.test(title)||BAD.test(title)||!GOOD.test(title+" "+query))return null;return {theme,name:title.replace(/\.[a-z0-9]+$/i,""),src:info.thumburl};}).filter(Boolean);
}
async function refreshPool(force){
  const key=weekKey();const saved=JSON.parse(localStorage.getItem("trailmark-renders-v2")||"null");
  if(!force&&saved&&saved.week===key&&saved.pool&&saved.pool.length){state.pool=saved.pool;draw();load(scenes()[state.si%scenes().length]);return;}
  $("sceneHint").textContent="Pulling this week's renders…";
  const batches=await Promise.all(QUERIES.map(([theme,q])=>search(theme,q).catch(()=>[])));
  const seen=new Set();const pool=[];
  batches.flat().forEach(item=>{if(seen.has(item.src))return;seen.add(item.src);pool.push(item);});
  state.pool=pool.slice(0,24);
  localStorage.setItem("trailmark-renders-v2",JSON.stringify({week:key,pool:state.pool}));
  draw();if(state.pool.length)load(scenes()[state.si%scenes().length]);
}
function init(){
  [["all","All scenes"],["military","Military"],["crusader","Crusader"],["marble","Marble"]].forEach(([id,label])=>{const o=document.createElement("option");o.value=id;o.textContent=label;$("theme").appendChild(o);});
  ["all","military","crusader","marble","grit","build","focus","classic"].forEach(id=>{const o=document.createElement("option");o.value=id;o.textContent=id==="all"?"All lines":id[0].toUpperCase()+id.slice(1);$("category").appendChild(o);});
  $("theme").onchange=e=>{state.theme=e.target.value;state.si=0;draw();const s=scenes();if(s.length)load(s[0]);};
  $("category").onchange=e=>{state.category=e.target.value;state.qi=0;draw();};
  $("shuffle").onclick=()=>{state.custom="";$("custom").value="";state.qi++;state.si++;draw();const s=scenes();if(s.length)load(s[state.si%s.length]);};
  $("daily").onclick=()=>{state.custom="";$("custom").value="";state.qi=hash(dayKey()+state.category)%quotes().length;const s=scenes();if(s.length)state.si=hash(dayKey()+state.theme)%s.length;draw();if(s.length)load(s[state.si%s.length]);};
  $("applyCustom").onclick=()=>{state.custom=$("custom").value.trim();if(state.custom)draw();};
  $("refresh").onclick=()=>refreshPool(true);
  $("save").onclick=async()=>{const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));if(!blob)return;const file=new File([blob],"trailmark.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return;}catch(e){if(e.name==="AbortError")return;}}const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="trailmark.png";a.click();};
  const d=new Date();$("timeLabel").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});$("dateLabel").textContent=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});
  state.qi=hash(dayKey())%QUOTES.length;draw();refreshPool(false);
}
init();
</script></body></html>
